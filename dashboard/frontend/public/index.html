<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbitrage Bot Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; }
        #root { padding: 20px; max-width: 1200px; margin: auto; }
    </style>
</head>
<body>
    <h1>Arbitrage Bot Dashboard</h1>
    <div id="root"></div>

    <!-- Load React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Load Babel to transpile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load Socket.IO client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <!-- Load our React components -->
    <!-- The 'type="text/babel"' attribute tells Babel to transpile these scripts -->
    <!-- Note: In a production build, these would be bundled into one file. -->
    <script type="text/babel" src="../src/components/StatusIndicator.js"></script>
    <script type="text/babel" src="../src/components/ControlButtons.js"></script>
    <script type="text/babel" src="../src/components/LogViewer.js"></script>
    <script type="text/babel" src="../src/App.js"></script>
    <script type="text/babel" src="../src/index.js"></script>
</body>
</html>
