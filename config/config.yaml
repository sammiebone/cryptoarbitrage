# Configuration for the crypto arbitrage bot

# Exchanges to use for arbitrage
exchanges:
  - mock_exchange_1
  - mock_exchange_2

# Assets to trade
assets:
  - BTC
  - ETH
  - USD

# Risk management settings
dry_run: true # If true, bot will log trades but not execute them.
min_profitability_pct: 0.1 # Minimum profitability to execute a trade
max_trade_size_usd: 100 # Maximum trade size in USD

# Slippage settings
slippage_pct: 0.05 # Assumed slippage for dry runs

# Database settings
database_url: "sqlite:///trades.db"

# API keys for real exchanges are now loaded from environment variables.
# See SECURITY.md for instructions on how to set them.
