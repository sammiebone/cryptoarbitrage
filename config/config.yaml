# Automated Crypto Arbitrage Service Configuration

exchanges:
  # The mock exchange is useful for testing the bot's logic without real funds.
  mock:
    enabled: true
    api_key: "mock_key"
    api_secret: "mock_secret"

  # Real exchanges are skipped due to placeholder keys.
  # To enable, set enabled to true and replace the keys.
  binance:
    enabled: false
    api_key: "YOUR_BINANCE_API_KEY"
    api_secret: "YOUR_BINANCE_API_SECRET"

  kraken:
    enabled: false
    api_key: "YOUR_KRAKEN_API_KEY"
    api_secret: "YOUR_KRAKEN_API_SECRET"

trading:
  base_currency: "USDT"
  trade_size_percentage: 0.1

  # A list of specific trading pairs to monitor. If empty, all are scanned.
  monitored_symbols: []

risk:
  min_profitability_percentage: 0.002 # 0.2%

  # The maximum slippage allowed for a single trade.
  max_slippage_percentage: 1.0

app:
  dry_run: true
  poll_interval: 5 # Time to wait between cycles, in seconds

  # Select which arbitrage strategies to run.
  strategies:
    triangular: true
    direct: true
